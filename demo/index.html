<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>maplibre-legend-control demo</title>
    <style>
      body {
        margin: 0;
      }
      #map {
        position: absolute;
        inset: 0;
      }

      /* #map .maplibre-legend-control {
        --legend-control-radius: 4px;
        --legend-control-color-primary: #0074d9;
      } */
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { Map, config } from "maplibre-gl";
      import "maplibre-gl/dist/maplibre-gl.css";
      // Import the CSS directly rather than relying on src/index.ts's own
      // "import ./style.css" - since only some of that barrel file's exports
      // are used below, the demo's full-app bundle drops that side effect
      // along with it. Matches what real consumers do (see README).
      import "../src/style.css";
      import { LegendControl } from "../src/index.ts";
      import { LogoControl } from "@maptoolkit/maplibre-logo-control";
      import "@maptoolkit/maplibre-logo-control/style.css";

      // maplibre-gl derives its worker URL from its own import.meta.url, which
      // only works when it's served as its own file (true in dev, served
      // straight from node_modules). The production build bundles it into
      // one chunk instead, so that derived URL 404s and the worker hangs
      // forever - point it at the copied worker file explicitly (see
      // vite.config.mts's copyMaplibreWorkerFiles plugin).
      if (import.meta.env.PROD) {
        config.WORKER_URL = new URL("./maplibre-gl-worker.mjs", import.meta.url).href;
      }

      // The legend reads its entries from the style's `maptoolkit:legend`
      // metadata, so during development the demo must point at a style that
      // carries it. `?style=<url>` overrides the default public style, e.g.
      // a style served by a local styleeditor/styles instance.
      const params = new URLSearchParams(location.search);
      const style = params.get("style") ?? "https://styles.maptoolkit.org/summer.json";

      const map = new Map({
        container: "map",
        style,
        center: { lng: 15.9967, lat: 48.3319 }, // Tulln an der Donau
        zoom: 12,
      });

      map.addControl(new LogoControl());

      const ctrl = new LegendControl();
      map.addControl(ctrl);
    </script>
  </body>
</html>
