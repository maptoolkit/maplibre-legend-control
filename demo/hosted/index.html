<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maptoolkit Legende – Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@maptoolkit/maplibre-style-control@1.1.1/dist/maplibre-style-control.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@maptoolkit/maplibre-logo-control@1.0.0/dist/maplibre-logo-control.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@maptoolkit/maplibre-legend-control@1.0.2/dist/maplibre-legend-control.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #map {
        position: absolute;
        inset: 0;
      }
    </style>
    <!-- The controls import "maplibre-gl" by its bare name: one copy for all of them. -->
    <script type="importmap">
      {
        "imports": {
          "maplibre-gl": "https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.mjs",
          "@maptoolkit/maplibre-style-control": "https://cdn.jsdelivr.net/npm/@maptoolkit/maplibre-style-control@1.1.1/dist/maplibre-style-control.js",
          "@maptoolkit/maplibre-logo-control": "https://cdn.jsdelivr.net/npm/@maptoolkit/maplibre-logo-control@1.0.0/dist/maplibre-logo-control.js",
          "@maptoolkit/maplibre-legend-control": "https://cdn.jsdelivr.net/npm/@maptoolkit/maplibre-legend-control@1.0.2/dist/maplibre-legend-control.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { Map as MapLibreMap, NavigationControl } from "maplibre-gl";
      import { StyleControl } from "@maptoolkit/maplibre-style-control";
      import { LogoControl } from "@maptoolkit/maplibre-logo-control";
      import { LegendControl } from "@maptoolkit/maplibre-legend-control";

      // The published Maptoolkit styles (styles.maptoolkit.org) carry the legend
      // metadata; the style control offers the same styles by default. The map's
      // locale table gives them German names.
      const map = new MapLibreMap({
        container: "map",
        style: "https://styles.maptoolkit.org/summer.json",
        center: [11.39, 47.27],
        zoom: 12.5,
        hash: true,
        locale: {
          "StyleControl.Style.Summer": "Sommer",
          "StyleControl.Style.Winter": "Winter",
          "StyleControl.Style.Light": "Hell",
          "StyleControl.Style.Dark": "Dunkel",
          "StyleControl.Style.Cycling": "Rad",
          "StyleControl.Style.Hiking": "Wandern",
          "StyleControl.Style.Street": "Straße",
        },
      });
      map.addControl(new NavigationControl(), "top-right");
      map.addControl(new LogoControl());
      const styleControl = new StyleControl();
      map.addControl(styleControl);
      // the four buttons: the icon alone top-left, the legend at the foot of the style control's
      // panel bottom-left above the logo (added after the style control), icon and word bottom-right,
      // and the word on MapLibre's attribution line
      map.addControl(new LegendControl({ button: "icon" }), "top-left");
      map.addControl(new LegendControl({ button: "style-control", styleControl }));
      map.addControl(new LegendControl({ button: "icon-text" }), "bottom-right");
      map.addControl(new LegendControl({ button: "attribution" }));
    </script>
  </body>
</html>
