name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push release tags and create GitHub releases
        run: |
          tags=$(git tag --points-at HEAD)
          if [ -n "$tags" ]; then
            git push origin --tags
            for tag in $tags; do
              gh release create "$tag" --title "$tag" --generate-notes
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Consumers that pin this package (styleeditor, community docs) open a bump PR on this
      # event; each one ignores packages it doesn't use and waits until npm serves the version.
      # The release is read off the tag changesets just created, like the step above: changeset
      # v3 prints its publish result in a format changesets/action@v1 doesn't parse, so the
      # action's `published` / `publishedPackages` outputs stay empty.
      - name: Notify consumers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MAPTOOLKIT_OPS_PAT }}
        run: |
          version=$(git tag --points-at HEAD | sed -n 's/^v//p' | head -1)
          [ -n "$version" ] || { echo "Nothing published in this run."; exit 0; }
          name=$(node -p "require('./package.json').name")
          for repo in maptoolkit/styleeditor maptoolkit/docs; do
            gh api "repos/$repo/dispatches" -f event_type=maptoolkit-package-released \
              -f "client_payload[package]=$name" -f "client_payload[version]=$version" \
              && echo "$repo ← $name@$version" \
              || echo "::warning::could not notify $repo about $name@$version"
          done
